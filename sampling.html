<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正規分布サンプリング実験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 計測器のように静かで正確。授業でも研究でもそのまま使える
   IDEA: 目盛り付きの測定器。母集団=目盛り、抽出=オレンジの指針
   PICTURE: 母集団ヒストグラムと標本平均ヒストグラム（理論曲線つき）
   COLOUR and TYPE: アルミ #e9eaec / 黒 / 指針オレンジ #ff4f00、夜 #141517。Geist + Noto Sans JP
   LAYOUT: 上段に設定と母集団、下段に「1つ選ぶ」と「標本平均」の2パネル */
:root{color-scheme:light dark;--bg:light-dark(#e9eaec,#141517);--panel:light-dark(#f7f7f8,#1d1f22);--ink:light-dark(#121316,#e9eaec);--mute:light-dark(#5d6168,#9a9fa7);--line:light-dark(#cfd2d6,#33363b);--bar:light-dark(#b7bbc1,#464a51);--bar2:light-dark(#2a2c30,#cfd2d6);--acc:#ff4f00;--accs:light-dark(#ffe3d6,#3a2014)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Geist,"Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3.5vw,48px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(26px,4vw,40px);line-height:1.1;margin:0 0 6px;font-weight:700;text-wrap:balance}
h2{font-size:20px;margin:0 0 4px;font-weight:700}
p.lead{margin:0;color:var(--mute);max-width:70ch}
.params{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin:20px 0 16px}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
input[type=number]{font:500 16px Geist,sans-serif;width:120px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:500 15px Geist,"Noto Sans JP",sans-serif;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--mute)}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
button.on{background:var(--accs);border-color:var(--acc)}
button.ghost{background:transparent;color:var(--mute);font-size:14px}
.note{font-size:13px;color:var(--mute)}
.fig{position:relative;min-height:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.fig.s{min-height:260px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px;margin:10px 0 0;font-size:14px;color:var(--mute)}
.stats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.card .fig{background:var(--bg)}
.read{display:flex;align-items:baseline;gap:12px;margin:12px 0;flex-wrap:wrap}
.read .big{font-size:clamp(36px,6vw,52px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc)}
.read .sub{color:var(--mute);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.row .lab{font-size:13px;color:var(--mute);min-width:5.5em}
.chips button{min-width:52px;padding:0 12px}
.tbl{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-weight:500;color:var(--mute);font-size:13px}
td:first-child,th:first-child{text-align:left;color:var(--mute)}
tr.new td{background:var(--accs)}
.empty{padding:16px;color:var(--mute);font-size:14px;text-align:center}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.last{font-size:13px;color:var(--mute);margin-top:8px;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.read .big.flash{animation:fl .35s ease-out}@keyframes fl{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<section class="band"><div class="wrap">
  <h1>正規分布サンプリング実験</h1>
  <p class="lead">平均と標準偏差を決めて母集団をつくり、1つずつ選んだり、n個ずつ抽出して標本平均の分布を確かめたりできます。</p>
  <form class="params" id="pf">
    <label class="f">平均 μ<input type="number" id="mu" value="50" step="any"></label>
    <label class="f">標準偏差 σ<input type="number" id="sd" value="10" step="any" min="0.0001"></label>
    <label class="f">データ数 N<input type="number" id="N" value="10000" step="1" min="10" max="1000000"></label>
    <button class="pri" type="submit">母集団を生成</button>
    <span class="note" id="pmsg">生成し直すと、選んだ記録はリセットされます。</span>
  </form>
  <div class="fig" id="popFig"><svg id="popSvg" role="img" aria-label="母集団のヒストグラム"></svg></div>
  <div class="stats" id="popStats"></div>
</div></section>

<section class="band" style="padding-top:0"><div class="wrap grid">
  <div class="card">
    <div class="hd"><div><h2>1つ選ぶ</h2><div class="note">母集団からランダムに1つ取り出して記録します</div></div>
      <button class="ghost" id="clrD" type="button">記録を消去</button></div>
    <div class="read"><span class="big" id="dBig">—</span><span class="sub" id="dSub">まだ選んでいません</span></div>
    <div class="row"><button class="acc" id="d1" type="button">1つ選ぶ</button><button id="d10" type="button">10回選ぶ</button><button id="dCopy" type="button">CSVをコピー</button></div>
    <div class="stats" id="dStats"></div>
    <div class="tbl" id="dTbl"></div>
  </div>

  <div class="card">
    <div class="hd"><div><h2>標本平均</h2><div class="note">n個を抽出して平均を出し、それを繰り返し記録します</div></div>
      <button class="ghost" id="clrM" type="button">記録を消去</button></div>
    <div class="row chips"><span class="lab">標本サイズ n</span>
      <span id="nChips"></span>
      <input type="number" id="nIn" value="10" min="1" step="1" aria-label="標本サイズ n" style="width:96px">
    </div>
    <div class="row"><span class="lab">抽出方法</span>
      <button id="wor" class="on" type="button">非復元（重複なし）</button><button id="wr" type="button">復元（重複あり）</button>
    </div>
    <div class="row"><span class="lab">繰り返す</span>
      <button class="acc" data-rep="1" type="button">1回</button><button data-rep="10" type="button">10回</button><button data-rep="100" type="button">100回</button><button data-rep="1000" type="button">1000回</button>
      <button id="play" type="button">▶ 連続</button>
    </div>
    <div class="read"><span class="big" id="mBig">—</span><span class="sub" id="mSub">まだ抽出していません</span></div>
    <div class="hd" style="align-items:center"><span class="note" id="mCap">標本平均の分布</span>
      <button id="zoom" type="button" class="ghost">拡大表示</button></div>
    <div class="fig s"><svg id="mSvg" role="img" aria-label="標本平均のヒストグラム"></svg></div>
    <div class="stats" id="mStats"></div>
    <div class="last" id="mLast"></div>
    <div class="row"><button id="mCopy" type="button">CSVをコピー</button><span class="note" id="copyMsg"></span></div>
    <div class="tbl" id="mTbl"></div>
  </div>
</div></section>

<script>
{
const $=id=>document.getElementById(id);
const fmt=v=>Number.isFinite(v)?v.toFixed(2):'—';
let pop=new Float64Array(0),idx=new Int32Array(0),P={mu:50,sd:10,N:10000};
let draws=[],means=[],lastSample=[],n=10,repl=false,zoom=false,timer=null;

function randn(){let u=0;while(u===0)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())}
function stats(a){const k=a.length;if(!k)return{k:0,m:NaN,s:NaN};let m=0;for(const v of a)m+=v;m/=k;let q=0;for(const v of a)q+=(v-m)**2;return{k,m,s:k>1?Math.sqrt(q/(k-1)):NaN,ps:Math.sqrt(q/k)}}
const pdf=(x,m,s)=>Math.exp(-(((x-m)/s)**2)/2)/(s*Math.sqrt(2*Math.PI));

function gen(){
  const mu=parseFloat($('mu').value),sd=parseFloat($('sd').value),N=Math.round(parseFloat($('N').value));
  if(!Number.isFinite(mu)||!(sd>0)||!(N>=10&&N<=1000000)){$('pmsg').textContent='μは数値、σは正の数、Nは10〜1,000,000で指定してください。';return}
  stop();
  pop=new Float64Array(N);for(let i=0;i<N;i++)pop[i]=mu+sd*randn();
  idx=new Int32Array(N);for(let i=0;i<N;i++)idx[i]=i;
  let s=0,q=0,mn=Infinity,mx=-Infinity;for(const v of pop){s+=v;if(v<mn)mn=v;if(v>mx)mx=v}
  const m=s/N;for(const v of pop)q+=(v-m)**2;
  P={mu,sd,N,m,s:Math.sqrt(q/N),mn,mx};
  draws=[];means=[];lastSample=[];
  if(n>N)setN(N);
  $('pmsg').textContent=`N = ${N.toLocaleString()} 個を生成しました。`;
  renderAll();
}

function sample(k){
  const N=P.N,out=new Array(k);
  if(repl){for(let i=0;i<k;i++)out[i]=pop[Math.floor(Math.random()*N)];return out}
  for(let i=0;i<k;i++){const j=i+Math.floor(Math.random()*(N-i));const t=idx[i];idx[i]=idx[j];idx[j]=t;out[i]=pop[idx[i]]}
  return out;
}

/* ---- charts ---- */
function hist(svg,vals,o){
  const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const narrow=W<520,m={l:narrow?34:46,r:12,t:14,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const {lo,hi,bins}=o,bw=(hi-lo)/bins,c=new Array(bins).fill(0);
  for(const v of vals){const b=Math.floor((v-lo)/bw);if(b>=0&&b<bins)c[b]++}
  let ymax=1;for(const x of c)if(x>ymax)ymax=x;
  for(const cv of o.curves||[])ymax=Math.max(ymax,cv.k*bw*pdf(cv.m,cv.m,cv.s)*1.02);
  const X=v=>m.l+(v-lo)/(hi-lo)*iw,Y=k=>m.t+ih-k/ymax*ih;
  let g='';
  const yt=[0,Math.round(ymax/2),Math.round(ymax)];
  for(const t of yt)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${t.toLocaleString()}</text>`;
  const gap=iw/bins>4?1:0;
  c.forEach((k,i)=>{if(k)g+=`<rect x="${X(lo+i*bw)+gap/2}" y="${Y(k)}" width="${Math.max(.5,iw/bins-gap)}" height="${Y(0)-Y(k)}" fill="${o.fill}"/>`});
  for(const cv of o.curves||[]){let d='';for(let i=0;i<=160;i++){const x=lo+(hi-lo)*i/160;d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(cv.k*bw*pdf(x,cv.m,cv.s)).toFixed(1)}g+=`<path d="${d}" fill="none" stroke="${cv.c}" stroke-width="${cv.w||1.6}" ${cv.dash?'stroke-dasharray="5 4"':''}/>`}
  for(const v of o.dots||[])if(v>=lo&&v<=hi)g+=`<circle cx="${X(v)}" cy="${Y(0)-5}" r="3" fill="var(--acc)" opacity=".55"/>`;
  for(const v of o.ticks||[])if(v>=lo&&v<=hi)g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${Y(0)}" y2="${Y(0)-8}" stroke="var(--acc)" opacity=".5"/>`;
  if(o.marker!=null&&o.marker>=lo&&o.marker<=hi){const x=X(o.marker);g+=`<line x1="${x}" x2="${x}" y1="${m.t}" y2="${Y(0)}" stroke="var(--acc)" stroke-width="2"/><path d="M${x-6} ${m.t-2}L${x+6} ${m.t-2}L${x} ${m.t+7}Z" fill="var(--acc)"/>`}
  g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)"/>`;
  for(let k=-4;k<=4;k++){if(narrow&&k%2)continue;const v=o.c+k*o.step,x=X(v);
    g+=`<line x1="${x}" x2="${x}" y1="${Y(0)}" y2="${Y(0)+5}" stroke="var(--mute)"/><text x="${x}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--mute)">${narrow?fmtS(v):fmtS(v)}</text>`}
  if(!vals.length)g+=`<text x="${m.l+iw/2}" y="${m.t+ih/2}" text-anchor="middle" font-size="14" fill="var(--mute)">${o.empty||''}</text>`;
  svg.innerHTML=g;
}
const fmtS=v=>Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2);

function drawPop(){
  hist($('popSvg'),pop,{lo:P.mu-4*P.sd,hi:P.mu+4*P.sd,bins:64,c:P.mu,step:P.sd,fill:'var(--bar)',
    curves:[{k:P.N,m:P.mu,s:P.sd,c:'var(--ink)',dash:true}],ticks:draws,dots:lastSample.length<=200?lastSample:[],
    marker:draws.length?draws[draws.length-1]:null});
}
function curMeans(){return means.filter(r=>r.n===n&&r.repl===repl).map(r=>r.m)}
function seN(){const s=P.s/Math.sqrt(n);return repl?s:s*Math.sqrt((P.N-n)/(P.N-1))}
function drawMeans(){
  const vals=curMeans(),se=seN(),k=vals.length;
  const o=zoom&&se>0?{lo:P.m-4*se,hi:P.m+4*se,bins:40,c:P.m,step:se}:{lo:P.mu-4*P.sd,hi:P.mu+4*P.sd,bins:96,c:P.mu,step:P.sd};
  o.fill='var(--bar2)';o.empty='「繰り返す」を押すと、ここに標本平均がたまります';
  o.curves=[];
  if(!zoom)o.curves.push({k:Math.max(k,1),m:P.m,s:P.s,c:'var(--mute)',dash:true,w:1.2});
  if(se>0)o.curves.push({k:Math.max(k,1),m:P.m,s:se,c:'var(--acc)',w:2});
  o.marker=k?vals[k-1]:null;
  hist($('mSvg'),vals,o);
  $('mCap').innerHTML=`標本平均の分布（n = ${n}・${repl?'復元':'非復元'}）　<span style="color:var(--acc)">━</span> 理論分布 N(μ, SE²)${zoom?'':'　<span>┅</span> 母集団'}`;
}

/* ---- text renders ---- */
function renderPopStats(){
  $('popStats').innerHTML=`<span>実際の平均 <b>${fmt(P.m)}</b></span><span>実際のSD <b>${fmt(P.s)}</b></span><span>最小 <b>${fmt(P.mn)}</b></span><span>最大 <b>${fmt(P.mx)}</b></span><span>横軸の目盛り = μ ± kσ</span>`;
}
function renderDraws(){
  const st=stats(draws),k=draws.length;
  if(k){const v=draws[k-1];$('dBig').textContent=fmt(v);$('dSub').textContent=`z = ${((v-P.m)/P.s).toFixed(2)}　（${k}回目）`;flash('dBig')}
  else{$('dBig').textContent='—';$('dSub').textContent='まだ選んでいません'}
  $('dStats').innerHTML=`<span>記録数 <b>${k}</b></span><span>平均 <b>${fmt(st.m)}</b></span><span>SD <b>${fmt(st.s)}</b></span>`;
  if(!k){$('dTbl').innerHTML='<div class="empty">選んだ値がここに記録されます</div>';return}
  const rows=[];for(let i=k-1;i>=Math.max(0,k-300);i--){const v=draws[i];rows.push(`<tr${i===k-1?' class="new"':''}><td>${i+1}</td><td>${fmt(v)}</td><td>${((v-P.m)/P.s).toFixed(2)}</td></tr>`)}
  $('dTbl').innerHTML=`<table><thead><tr><th>回</th><th>値</th><th>z</th></tr></thead><tbody>${rows.join('')}</tbody></table>${k>300?'<div class="empty">最新300件を表示中（CSVには全件）</div>':''}`;
}
function renderMeans(){
  const vals=curMeans(),st=stats(vals),k=means.length,se=seN();
  if(k){const r=means[k-1];$('mBig').textContent=fmt(r.m);$('mSub').textContent=`${r.k}回目の標本平均（n = ${r.n}）`;flash('mBig')}
  else{$('mBig').textContent='—';$('mSub').textContent='まだ抽出していません'}
  $('mStats').innerHTML=`<span>この条件の回数 <b>${st.k.toLocaleString()}</b></span><span>標本平均の平均 <b>${fmt(st.m)}</b></span><span>標本平均のSD（実測） <b>${fmt(st.s)}</b></span><span>理論SE <b>${fmt(se)}</b></span>`;
  $('mLast').textContent=lastSample.length?`直近の標本（${lastSample.length}個）: `+(lastSample.length<=50?lastSample.map(fmt).join(', '):lastSample.slice(0,50).map(fmt).join(', ')+' …'):'';
  if(!k){$('mTbl').innerHTML='<div class="empty">標本平均がここに記録されます</div>';return}
  const rows=[];for(let i=k-1;i>=Math.max(0,k-300);i--){const r=means[i];rows.push(`<tr${i===k-1?' class="new"':''}><td>${r.k}</td><td>${r.n}</td><td>${r.repl?'復元':'非復元'}</td><td>${fmt(r.m)}</td><td>${fmt(r.sd)}</td></tr>`)}
  $('mTbl').innerHTML=`<table><thead><tr><th>回</th><th>n</th><th>方法</th><th>標本平均</th><th>標本SD</th></tr></thead><tbody>${rows.join('')}</tbody></table>${k>300?'<div class="empty">最新300件を表示中（CSVには全件）</div>':''}`;
}
function flash(id){const e=$(id);e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}
function renderAll(){renderPopStats();renderDraws();renderMeans();drawPop();drawMeans()}

/* ---- actions ---- */
function draw1(t){for(let i=0;i<t;i++)draws.push(pop[Math.floor(Math.random()*P.N)]);renderDraws();drawPop()}
function rep(t){
  for(let i=0;i<t;i++){const s=sample(n),st=stats(s);means.push({k:means.length+1,n,repl,m:st.m,sd:st.s});if(i===t-1)lastSample=s}
  renderMeans();drawMeans();drawPop();
}
function setN(v){v=Math.max(1,Math.min(P.N,Math.round(v)||1));n=v;$('nIn').value=v;
  $('nChips').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.n===v));renderMeans();drawMeans()}
function stop(){if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ 連続';$('play').classList.remove('on')}}
async function copy(txt,btn){btn=btn||$('mCopy');let msg;try{await navigator.clipboard.writeText(txt);msg='コピーしました'}catch(e){msg='コピーできませんでした'}btn.textContent=msg;setTimeout(()=>btn.textContent='CSVをコピー',1600)}

$('nChips').innerHTML=[5,10,20,30,50,100].map(v=>`<button type="button" data-n="${v}">${v}</button> `).join('');
$('nChips').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setN(+b.dataset.n)});
$('nIn').addEventListener('change',()=>setN(+$('nIn').value));
$('wor').addEventListener('click',()=>{repl=false;$('wor').classList.add('on');$('wr').classList.remove('on');renderMeans();drawMeans()});
$('wr').addEventListener('click',()=>{repl=true;$('wr').classList.add('on');$('wor').classList.remove('on');renderMeans();drawMeans()});
document.querySelectorAll('[data-rep]').forEach(b=>b.addEventListener('click',()=>rep(+b.dataset.rep)));
$('play').addEventListener('click',()=>{if(timer){stop();return}timer=setInterval(()=>rep(1),80);$('play').textContent='■ 停止';$('play').classList.add('on')});
$('zoom').addEventListener('click',()=>{zoom=!zoom;$('zoom').textContent=zoom?'母集団と同じ目盛り':'拡大表示';drawMeans()});
$('d1').addEventListener('click',()=>draw1(1));
$('d10').addEventListener('click',()=>draw1(10));
$('clrD').addEventListener('click',()=>{draws=[];renderDraws();drawPop()});
$('clrM').addEventListener('click',()=>{stop();means=[];lastSample=[];renderMeans();drawMeans();drawPop()});
$('dCopy').addEventListener('click',()=>copy('回,値,z\n'+draws.map((v,i)=>`${i+1},${v},${(v-P.m)/P.s}`).join('\n'),$('dCopy')));
